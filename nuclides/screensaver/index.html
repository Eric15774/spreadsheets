<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart of the Nuclides Screensaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: Inter, Arial, sans-serif; color: #e9edf5; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle { cursor: none; }
  #card {
    position: fixed; width: min(460px, 88vw); padding: 24px 26px 22px; box-sizing: border-box;
    background: rgba(13, 19, 38, 0.97); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(12px); transition: opacity .7s, transform .7s; pointer-events: none;
  }
  #card.show { opacity: 1; transform: none; }
  #card.right { right: 5vw; top: 50%; transform: translateY(calc(-50% + 12px)); }
  #card.right.show { transform: translateY(-50%); }
  #card.bottom { left: 0; right: 0; margin: 0 auto; bottom: 3vh; box-sizing: border-box; width: min(440px, 94vw); }
  .notation { display: inline-flex; align-items: center; font-weight: 800; font-size: 44px; line-height: 1; margin-right: 14px; vertical-align: middle; }
  .notation .nums { display: flex; flex-direction: column; justify-content: space-between; font-size: 17px; font-weight: 600; margin-right: 3px; height: 44px; text-align: right; color: #aab4c8; }
  .name { display: inline-block; vertical-align: middle; }
  .name h1 { margin: 0; font-size: 28px; font-weight: 800; }
  .name .sub { color: #aab4c8; font-size: 14px; margin-top: 4px; }
  .row { margin-top: 16px; }
  .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8b96ad; margin-bottom: 4px; }
  .big { font-size: 23px; font-weight: 600; }
  .small { font-size: 15px; color: #c3cad8; margin-top: 3px; }
  .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .others { font-size: 13px; color: #aab4c8; margin-top: 6px; }
  #title { position: fixed; left: 24px; top: 18px; transition: opacity 1s; pointer-events: none; }
  #title h2 { margin: 0; font-size: 22px; font-weight: 800; }
  #title div { font-size: 13px; color: #8b96ad; margin-top: 3px; }
  #legend { position: fixed; right: 20px; bottom: 18px; font-size: 13px; background: rgba(13,19,38,.85); padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); transition: opacity 1s; pointer-events: none; }
  #legend div { margin: 3px 0; }
  #fs { position: fixed; right: 16px; top: 14px; background: rgba(255,255,255,.1); color: #e9edf5; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 7px 12px; font: 600 13px Inter, Arial, sans-serif; cursor: pointer; transition: opacity .6s; }
  body.idle #fs { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 24px; bottom: 16px; font-size: 12px; color: #6f7a92; transition: opacity .6s; }
  body.idle #hint { opacity: 0; }
</style>
</head>

      ctx.fillText(d[2] + "-" + (z + n), sx + s / 2, sy + s * 0.36);
      ctx.font = `400 ${Math.round(s * 0.15)}px Inter, Arial`;
      ctx.fillText(cellHalfLife(d), sx + s / 2, sy + s * 0.64);
      if (d[7] && d[7] !== "STABLE") {
        ctx.font = `600 ${Math.round(s * 0.13)}px Inter, Arial`;
        ctx.fillText(d[7], sx + s / 2, sy + s * 0.86);
      }
    }
  }

  // axis labels at overview
  if (s < 12) {
    const a = Math.max(0, Math.min(1, (12 - s) / 4));
    ctx.fillStyle = `rgba(170,180,200,${a})`; ctx.font = "600 13px Inter, Arial"; ctx.textAlign = "center";
    const [bx, by] = toScreen((maxN + 1) / 2, 0, cam);
    ctx.fillText("Number of neutrons (N) →", bx, by + 24);
    const [lx, ly] = toScreen(0, (maxZ + 1) / 2, cam);
    ctx.save(); ctx.translate(lx - 18, ly); ctx.rotate(-Math.PI / 2); ctx.fillText("Number of protons (Z) →", 0, 0); ctx.restore();
    ctx.font = "400 11px Inter, Arial"; ctx.fillStyle = `rgba(170,180,200,${a * 0.8})`;
    for (const m of MAGIC) {
      const [mx, my] = toScreen(m + 0.5, 0, cam); ctx.fillText(m, mx, my + 10);
      if (m > maxZ) continue;
      const [px, py] = toScreen(0, m + 0.5, cam); ctx.textAlign = "right"; ctx.fillText(m, px - 4, py + 4); ctx.textAlign = "center";
    }
  }

  // decay arrow to daughter
  if (target && arrow > 0) {
    const sh = daughterShift(target[7] || "");
    if (sh) {
      const [ax, ay] = toScreen(target[1] + 0.5, target[0] + 0.5, cam);
      const [bx, by] = toScreen(target[1] + sh[1] + 0.5, target[0] + sh[0] + 0.5, cam);
      const len = Math.hypot(bx - ax, by - ay);
      if (len > 1) {
        const ux = (bx - ax) / len, uy = (by - ay) / len;
        const sx = ax + ux * s * 0.3, sy = ay + uy * s * 0.3;
        const ex = sx + (bx - ux * s * 0.3 - sx) * arrow, ey = sy + (by - uy * s * 0.3 - sy) * arrow;
        ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = Math.max(2, s * 0.05); ctx.lineCap = "round";
        ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        const h = s * 0.16;
        ctx.beginPath(); ctx.moveTo(ex, ey);
        ctx.lineTo(ex - ux * h - uy * h * 0.6, ey - uy * h + ux * h * 0.6);
        ctx.lineTo(ex - ux * h + uy * h * 0.6, ey - uy * h - ux * h * 0.6);
        ctx.closePath(); ctx.fillStyle = "white"; ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  // highlight target
  if (target && glow > 0) {
    const [sx, sy] = toScreen(target[1], target[0] + 1, cam);
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    const w = Math.max(3, s * 0.07);
    ctx.strokeStyle = `rgba(255,255,255,${glow * pulse})`; ctx.lineWidth = w;
    ctx.shadowColor = "white"; ctx.shadowBlur = 18 * glow;
    const pad = s < 12 ? 6 : 0;
    ctx.strokeRect(sx - pad, sy - pad, s + pad * 2, s + pad * 2);
    ctx.shadowBlur = 0;
  }
}

// ---------- card ----------
const card = document.getElementById("card");
function showCard(d) {
  const z = d[0], n = d[1], A = z + n, name = ELEMENTS[z];
  const hl = friendlyHalfLife(d);
  const fam = FAMILIES[family(d[7])];
  let decay;
  if (d[7] === "STABLE") decay = `<div class="big"><span class="chip" style="background:${fam.color}"></span>None</div><div class="small">Stable nuclei stay as they are forever, as far as anyone can measure.</div>`;
  else if (!d[7]) decay = `<div class="big"><span class="chip" style="background:${fam.color}"></span>Not known</div>`;
  else {
    const pct = d[8] !== "" && d[8] !== null && +d[8] < 100 ? ` <span class="small">(${+d[8]}% of decays)</span>` : "";
    decay = `<div class="big"><span class="chip" style="background:${fam.color}"></span>${fam.label}${pct}</div><div class="small">${modeText(d[7])}.</div>`;
    const sh = daughterShift(d[7]);
    if (sh) {
      const dz = z + sh[0], dn = n + sh[1];
      if (dz >= 0 && dn >= 0) decay += `<div class="small">Becomes <b>${ELEMENTS[dz]}-${dz + dn}</b>.</div>`;
    }
    if (d[9]) {
      const others = d[9].split("; ").slice(0, 3).map(o => { const [m, p] = o.split(" "); return shortMode(m) + (p ? " " + p.replace(/E-(\d+)/, (_, e) => " × 10⁻" + sup(String(+e))) : ""); });
      decay += `<div class="others">Also: ${others.join(", ")}</div>`;
    }
  }
  const be = d[10] !== "" && d[10] !== null ? `<div class="row"><div class="label">Binding energy</div><div class="small">${(+d[10]).toFixed(2)} MeV per nucleon</div></div>` : "";
  card.innerHTML = `
    <div><span class="notation"><span class="nums"><span>${A}</span><span>${z}</span></span>${d[2]}</span><span class="name"><h1>${z === 0 ? "Free neutron" : name + "-" + A}</h1><div class="sub">${z} protons · ${n} neutrons</div></span></div>
    <div class="row"><div class="label">Half-life</div><div class="big">${hl.big}</div><div class="small">${hl.small}</div></div>
    <div class="row"><div class="label">Decay</div>${decay}</div>${be}`;
  card.className = (landscape() ? "right" : "bottom") + " show";
}
function hideCard() { card.className = card.className.replace(" show", ""); }

// ---------- legend ----------
document.getElementById("legend").innerHTML = Object.values(FAMILIES).map(f => `<div><span class="chip" style="background:${f.color}"></span>${f.label}</div>`).join("");

// ---------- animation ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const T = { overview: 3000, zoomIn: 4500, hold: 9000, zoomOut: 3500 };
let phase = "overview", t0 = performance.now(), target = null, last = [];
function pick() {
  let d;
  do { d = DATA[Math.floor(Math.random() * DATA.length)]; } while (last.includes(d));
  last.push(d); if (last.length > 20) last.shift();
  return d;
}
target = pick();
function next() { // skip ahead
  if (phase === "hold") { phase = "zoomOut"; t0 = performance.now(); hideCard(); }
  else if (phase === "overview") { phase = "zoomIn"; t0 = performance.now(); }
}
// camera that keeps the target moving in a straight line on screen while zooming
function camAt(u) {
  const ov = overviewCam(), sc = closeScale();
  const s = Math.exp(Math.log(ov.s) + (Math.log(sc) - Math.log(ov.s)) * u);
  const P = [target[1] + 0.5, target[0] + 0.5];
  const q0 = [(P[0] - ov.cx) * ov.s, -(P[1] - ov.cy) * ov.s];
  const off = targetOffset();
  const q = [q0[0] + (off[0] - q0[0]) * u, q0[1] + (off[1] - q0[1]) * u];
  return { cx: P[0] - q[0] / s, cy: P[1] + q[1] / s, s };
}
const titleEl = document.getElementById("title"), legendEl = document.getElementById("legend");
function frame(now) {
  const el = now - t0;
  let cam, glow = 0, arrow = 0, overlay = 0;
  if (phase === "overview") {
    cam = overviewCam(); overlay = 1;
    glow = el > 1200 ? Math.min(1, (el - 1200) / 500) : 0;
    if (el > T.overview) { phase = "zoomIn"; t0 = now; }
  } else if (phase === "zoomIn") {
    const u = ease(Math.min(1, el / T.zoomIn));
    cam = camAt(u); glow = 1; overlay = 1 - u;
    if (el > T.zoomIn) { phase = "hold"; t0 = now; showCard(target); }
  } else if (phase === "hold") {
    cam = camAt(1); glow = 1;
    arrow = el > 1500 ? ease(Math.min(1, (el - 1500) / 1200)) : 0;
    if (el > T.hold) { phase = "zoomOut"; t0 = now; hideCard(); }
  } else {
    const u = ease(Math.min(1, el / T.zoomOut));
    cam = camAt(1 - u); glow = 1 - u; arrow = 1 - Math.min(1, el / 600); overlay = u;
    if (el > T.zoomOut) { phase = "overview"; t0 = now; target = pick(); }
  }
  titleEl.style.opacity = overlay; legendEl.style.opacity = overlay;
  draw(cam, target, glow, arrow);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("resize", () => { if (phase === "hold") showCard(target); });

// ---------- controls ----------
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); next(); }
  if (e.key === "f" || e.key === "F") toggleFs();
});
canvas.addEventListener("click", next);
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.getElementById("fs").addEventListener("click", toggleFs);
let idleTimer;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); }
document.addEventListener("mousemove", wake); document.addEventListener("touchstart", wake); wake();
</script>
</body>
</html>
