<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodic Table Screensaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: Inter, Arial, sans-serif; color: #e9edf5; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle { cursor: none; }
  #card {
    position: fixed; width: min(500px, 90vw); max-height: 92vh; overflow: hidden; box-sizing: border-box; padding: 24px 26px 22px;
    background: rgba(13, 19, 38, 0.97); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(12px); transition: opacity .7s, transform .7s; pointer-events: none;
  }
  #card.show { opacity: 1; transform: none; }
  #card.right { right: 4vw; top: 50%; transform: translateY(calc(-50% + 12px)); }
  #card.right.show { transform: translateY(-50%); }
  #card.bottom { left: 0; right: 0; margin: 0 auto; bottom: 2vh; width: min(460px, 94vw); padding: 18px 18px 16px; }
  .head { display: flex; align-items: center; gap: 16px; }
  .tile { width: 78px; height: 78px; border-radius: 10px; color: #141822; position: relative; flex: none; }
  .tile .z { position: absolute; left: 7px; top: 5px; font-size: 13px; font-weight: 600; }
  .tile .s { position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-size: 36px; font-weight: 800; }
  .head h1 { margin: 0; font-size: 30px; font-weight: 800; }
  .chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: #141822; margin-top: 6px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 18px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b96ad; margin-bottom: 3px; }
  .val { font-size: 17px; font-weight: 600; }
  .row { margin-top: 14px; }
  .txt { font-size: 15px; color: #d3d9e4; }
  #card.bottom .val { font-size: 15px; }
  #card.bottom .txt { font-size: 14px; }
  #card.bottom .head h1 { font-size: 24px; }
  #card.bottom .facts { gap: 8px 14px; margin-top: 12px; }
  #card.bottom .row { margin-top: 10px; }
  #title { position: fixed; left: 24px; top: 18px; transition: opacity 1s; pointer-events: none; }
  #title h2 { margin: 0; font-size: 22px; font-weight: 800; }
  #title div { font-size: 13px; color: #8b96ad; margin-top: 3px; }
  #fs { position: fixed; right: 16px; top: 14px; background: rgba(255,255,255,.1); color: #e9edf5; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 7px 12px; font: 600 13px Inter, Arial, sans-serif; cursor: pointer; transition: opacity .6s; }
  body.idle #fs { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 24px; bottom: 16px; font-size: 12px; color: #6f7a92; transition: opacity .6s; }
  body.idle #hint { opacity: 0; }
</style>
</head>

  alkaline:   { color: "#f5ad73", label: "Alkaline earth metal", z: [4, 12, 20, 38, 56, 88] },
  transition: { color: "#f2d473", label: "Transition metal", z: [] },
  post:       { color: "#a9d68d", label: "Post-transition metal", z: [13, 31, 49, 50, 81, 82, 83, 84, 113, 114, 115, 116] },
  metalloid:  { color: "#74d3bd", label: "Metalloid", z: [5, 14, 32, 33, 51, 52] },
  nonmetal:   { color: "#86b6f2", label: "Nonmetal", z: [1, 6, 7, 8, 15, 16, 34] },
  halogen:    { color: "#a5dcf2", label: "Halogen", z: [9, 17, 35, 53, 85, 117] },
  noble:      { color: "#bba3f2", label: "Noble gas", z: [2, 10, 18, 36, 54, 86, 118] },
  lanthanide: { color: "#f2a9d2", label: "Lanthanide", z: [] },
  actinide:   { color: "#d4b08c", label: "Actinide", z: [] }
};
function category(z) {
  if (z >= 57 && z <= 71) return "lanthanide";
  if (z >= 89 && z <= 103) return "actinide";
  for (const k in CATS) if (CATS[k].z.includes(z)) return k;
  return "transition";
}

// grid position: x = column (1-18), y = row (1-7, then 8.6 and 9.6 for the f-block)
DATA.forEach(d => {
  if (d.z >= 57 && d.z <= 71) { d.x = 3 + d.z - 57; d.y = 8.6; }
  else if (d.z >= 89 && d.z <= 103) { d.x = 3 + d.z - 89; d.y = 9.6; }
  else { d.x = +d.group; d.y = d.period; }
  d.cat = category(d.z);
});
const COLS = 18, ROWS = 9.6;

// ---------- formatting ----------
const STATE = { s: "Solid", l: "Liquid", g: "Gas" };
function sup(s) { const m = "⁰¹²³⁴⁵⁶⁷⁸⁹"; return String(s).split("").map(c => m[+c] ?? c).join(""); }
function config(c) { return c.replace(/([spdf])(\d+)/g, (_, l, n) => l + "<sup>" + n + "</sup>"); }
function temp(v) { return v === null ? "Unknown" : Math.round(v).toLocaleString("en-US") + " °C"; }
function density(d) {
  if (d.density === null) return "Unknown";
  if (d.state === "g") return parseFloat((d.density * 1000).toPrecision(3)) + " g/L";
  return parseFloat(d.density.toPrecision(3)) + " g/cm³";
}
function bodyLine(b) {
  if (b === null || b <= 0) return "";
  if (b >= 0.01) return `About ${parseFloat(b.toPrecision(2))}% of your body's mass.`;
  return "Present in your body in tiny trace amounts.";
}
function placeText(d) {
  if (d.z >= 57 && d.z <= 71) return "Period 6, lanthanide series";
  if (d.z >= 89 && d.z <= 103) return "Period 7, actinide series";
  return `Group ${d.group}, Period ${d.period}`;
}

// ---------- layout ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize); resize();

// chart units: cell (x, y) spans [x-1, x] by [y-1, y]; y grows downward
function overviewCam() {
  const L = 24, R = 24, Tp = 90, B = 50;
  const s = Math.min((W - L - R) / COLS, (H - Tp - B) / ROWS);
  const bx = (L + W - R) / 2, by = (Tp + H - B) / 2;
  return { cx: COLS / 2 - (bx - W / 2) / s, cy: ROWS / 2 - (by - H / 2) / s, s };
}
function landscape() { return W > 760 && W > H; }
function closeScale() { return landscape() ? Math.min(W / 7, H / 4.6) : Math.min(W / 3.6, H / 7); }
function targetOffset() { return landscape() ? [-W * 0.23, 0] : [0, -H * 0.3]; }
function toScreen(x, y, cam) { return [W / 2 + (x - cam.cx) * cam.s, H / 2 + (y - cam.cy) * cam.s]; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function draw(cam, target, glow, dim, overlay) {
  ctx.fillStyle = "#0b1020"; ctx.fillRect(0, 0, W, H);
  const s = cam.s, gap = Math.max(1.5, s * 0.06), r = Math.max(2, s * 0.08);
  ctx.textAlign = "center";
  // placeholders for the f-block
  for (const [y, txt] of [[6, "57-71"], [7, "89-103"]]) {
    const [sx, sy] = toScreen(2, y - 1, cam);
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1;
    roundRect(sx + gap / 2, sy + gap / 2, s - gap, s - gap, r); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = `600 ${Math.round(s * 0.18)}px Inter, Arial`;
    ctx.fillText(txt, sx + s / 2, sy + s * 0.56);
  }
  for (const d of DATA) {
    const [sx, sy] = toScreen(d.x - 1, d.y - 1, cam);
    if (sx > W || sy > H || sx + s < 0 || sy + s < 0) continue;
    const isT = d === target;
    ctx.globalAlpha = isT ? 1 : 1 - 0.55 * dim;
    ctx.fillStyle = CATS[d.cat].color;
    roundRect(sx + gap / 2, sy + gap / 2, s - gap, s - gap, r); ctx.fill();
    ctx.fillStyle = "#141822";
    if (s > 16) {
      ctx.font = `800 ${Math.round(s * 0.36)}px Inter, Arial`;
      ctx.fillText(d.sym, sx + s / 2, sy + s * 0.58);
      ctx.textAlign = "left"; ctx.font = `600 ${Math.round(s * 0.15)}px Inter, Arial`;
      ctx.fillText(d.z, sx + s * 0.12, sy + s * 0.22);
      ctx.textAlign = "center";
    }
    if (s > 55) {
      ctx.font = `400 ${Math.round(s * 0.11)}px Inter, Arial`;
      ctx.fillText(d.name, sx + s / 2, sy + s * 0.76);
      ctx.fillText(d.mass, sx + s / 2, sy + s * 0.9);
    }
    ctx.globalAlpha = 1;
  }
  // group and period numbers at overview
  if (s < 140) {
    ctx.fillStyle = "rgba(170,180,200,0.6)"; ctx.font = `600 ${Math.max(9, Math.round(s * 0.17))}px Inter, Arial`;
    for (let g = 1; g <= 18; g++) {
      const top = (g === 1 || g === 18) ? 0 : (g === 2 || g >= 13) ? 1 : 3;
      const [gx, gy] = toScreen(g - 0.5, top, cam); ctx.fillText(g, gx, gy - s * 0.12);
    }
  }
  // category key in the gap above the transition metals
  if (overlay > 0.01) {
    ctx.globalAlpha = overlay; ctx.textAlign = "left";
    const keys = Object.values(CATS), fs = Math.max(9, Math.round(s * 0.2));
    ctx.font = `600 ${fs}px Inter, Arial`;
    keys.forEach((c, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const [kx, ky] = toScreen(3.2 + col * 4.6, 0.25 + row * 0.5, cam);
      ctx.fillStyle = c.color; roundRect(kx, ky, s * 0.3, s * 0.3, 3); ctx.fill();
      ctx.fillStyle = "rgba(220,226,238,0.9)"; ctx.fillText(c.label, kx + s * 0.42, ky + s * 0.24);
    });
    ctx.globalAlpha = 1; ctx.textAlign = "center";
  }
  if (target && glow > 0) {
    const [sx, sy] = toScreen(target.x - 1, target.y - 1, cam);
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.strokeStyle = `rgba(255,255,255,${glow * pulse})`; ctx.lineWidth = Math.max(3, s * 0.05);
    ctx.shadowColor = "white"; ctx.shadowBlur = 18 * glow;
    roundRect(sx, sy, s, s, r); ctx.stroke(); ctx.shadowBlur = 0;
  }
}

// ---------- card ----------
const card = document.getElementById("card");
function showCard(d) {
  const c = CATS[d.cat];
  const disc = d.year === "Ancient times" ? "Known since ancient times" : d.year ? d.year : "Unknown";
  const look = [d.color, d.char].filter(Boolean).join(". ");
  const body = bodyLine(d.body);
  const synthetic = /synthetic/i.test(d.source);
  card.innerHTML = `
    <div class="head">
      <div class="tile" style="background:${c.color}"><span class="z">${d.z}</span><span class="s">${d.sym}</span></div>
      <div><h1>${d.name}</h1><span class="chip" style="background:${c.color}">${c.label}</span></div>
    </div>
    <div class="facts">
      <div><div class="label">Atomic mass</div><div class="val">${d.mass}</div></div>
      <div><div class="label">At room temperature</div><div class="val">${STATE[d.state] || "Unknown"}</div></div>
      <div><div class="label">Melting point</div><div class="val">${temp(d.mp)}</div></div>
      <div><div class="label">Boiling point</div><div class="val">${temp(d.bp)}</div></div>
      <div><div class="label">Density</div><div class="val">${density(d)}</div></div>
      <div><div class="label">Electronegativity</div><div class="val">${d.en === null ? "Unknown" : d.en}</div></div>
      <div><div class="label">Discovered</div><div class="val">${disc}</div></div>
      <div><div class="label">On the table</div><div class="val">${placeText(d)}</div></div>
    </div>
    <div class="row"><div class="label">Electron configuration</div><div class="val">${config(d.conf)}</div></div>
    ${look ? `<div class="row"><div class="label">What it is like</div><div class="txt">${look}</div></div>` : ""}
    ${d.uses ? `<div class="row"><div class="label">Used for</div><div class="txt">${d.uses}</div></div>` : ""}
    ${d.source ? `<div class="row"><div class="label">${synthetic ? "Where it comes from" : "Found in"}</div><div class="txt">${synthetic ? "Made in laboratories and reactors" : d.source}</div></div>` : ""}
    ${!d.uses && !d.source && d.z > 100 ? `<div class="row"><div class="txt">Only a few atoms have ever been made, and they last only moments. Many of its properties are still unknown.</div></div>` : ""}
    ${body ? `<div class="row"><div class="label">In your body</div><div class="txt">${body}</div></div>` : ""}`;
  card.className = (landscape() ? "right" : "bottom") + " show";
}
function hideCard() { card.className = card.className.replace(" show", ""); }

// ---------- animation ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const T = { overview: 3000, zoomIn: 4000, hold: 11000, zoomOut: 3000 };
let phase = "overview", t0 = performance.now(), target = null, last = [];
function pick() {
  let d;
  do { d = DATA[Math.floor(Math.random() * DATA.length)]; } while (last.includes(d));
  last.push(d); if (last.length > 40) last.shift();
  return d;
}
target = pick();
function next() {
  if (phase === "hold") { phase = "zoomOut"; t0 = performance.now(); hideCard(); }
  else if (phase === "overview") { phase = "zoomIn"; t0 = performance.now(); }
}
function camAt(u) {
  const ov = overviewCam(), sc = closeScale();
  const s = Math.exp(Math.log(ov.s) + (Math.log(sc) - Math.log(ov.s)) * u);
  const P = [target.x - 0.5, target.y - 0.5];
  const q0 = [(P[0] - ov.cx) * ov.s, (P[1] - ov.cy) * ov.s];
  const off = targetOffset();
  const q = [q0[0] + (off[0] - q0[0]) * u, q0[1] + (off[1] - q0[1]) * u];
  return { cx: P[0] - q[0] / s, cy: P[1] - q[1] / s, s };
}
const titleEl = document.getElementById("title");
function frame(now) {
  const el = now - t0;
  let cam, glow = 0, overlay = 0, dim = 0;
  if (phase === "overview") {
    cam = overviewCam(); overlay = 1;
    glow = el > 1200 ? Math.min(1, (el - 1200) / 500) : 0;
    if (el > T.overview) { phase = "zoomIn"; t0 = now; }
  } else if (phase === "zoomIn") {
    const u = ease(Math.min(1, el / T.zoomIn));
    cam = camAt(u); glow = 1; overlay = 1 - u; dim = u;
    if (el > T.zoomIn) { phase = "hold"; t0 = now; showCard(target); }
  } else if (phase === "hold") {
    cam = camAt(1); glow = 1; dim = 1;
    if (el > T.hold) { phase = "zoomOut"; t0 = now; hideCard(); }
  } else {
    const u = ease(Math.min(1, el / T.zoomOut));
    cam = camAt(1 - u); glow = 1 - u; overlay = u; dim = 1 - u;
    if (el > T.zoomOut) { phase = "overview"; t0 = now; target = pick(); }
  }
  titleEl.style.opacity = overlay;
  draw(cam, target, glow, dim, overlay);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("resize", () => { if (phase === "hold") showCard(target); });

// ---------- controls ----------
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); next(); }
  if (e.key === "f" || e.key === "F") toggleFs();
});
canvas.addEventListener("click", next);
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.getElementById("fs").addEventListener("click", toggleFs);
let idleTimer;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); }
document.addEventListener("mousemove", wake); document.addEventListener("touchstart", wake); wake();
</script>
</body>
</html>
